worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server_tokens off;

  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # nginx drops inherited add_header directives as soon as a level declares
    # one of its own, so the security set is repeated in every location that
    # sets a header rather than declared once at server level.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    # Content-hashed filenames: the URL changes whenever the bytes do.
    location /_astro/ {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
            # Pages are rewritten in place at each deploy, so they have to be
            # revalidated instead of served from a stale disk cache.
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri $uri/index.html =404;
    }
  }
}
